<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RISC-V Demo</title>


<!-- For the portofilio website to work -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<div id = "header"></div>
<iframe id="unity-frame" src="game/game.html" style="width:100%; border:none;"></iframe>
<script src = "/scripts/loader.js"></script>

  <!-- xterm assets (plain script puts Terminal on window) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
<script type="importmap">
{
  "imports": {
    "xterm": "https://cdn.jsdelivr.net/npm/xterm@5.3.0/+esm",
    "xterm-addon-fit": "https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/+esm"
  }
}
</script>


  <!-- Bootstrap -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body            { background:#121212; color:#eee; font-size: 25px }
    /* .terminal-pane   { width:500px; height:500px} */

    #screen-buttons .active { background:#0d6efd; color:#fff; }
    .debug-toggle {
      background-color: #f8f9fa18; /* light gray */
      padding: 10px 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgb(255, 255, 255);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      height: 50px;
    }

    .debug-toggle label {
      margin: 0;
      font-weight: 500;
      font-size: 24px;
      user-select: none;
    }

    .debug-toggle input[type="checkbox"] {
      transform: scale(1.2);
      cursor: pointer;
    }

    .run-demo-container {
      background-color: #e9f7ef; /* light green tint */
      padding: 3px 3px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      display: inline-block;
      margin-left: 1rem; /* like ms-3 */
      font-size: 16px;
    }

    #run-button {
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
      min-height: 34px;
      min-width: 127px;
      transition: background-color 0.2s, opacity 0.2s;
      margin: 0px;
      font-size: 22px;
    }

    #run-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .run-game-container {
      background-color: #e9f7ef; /* light green tint */
      padding: 3px 3px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      display: inline-block;
      margin-left: 1rem; /* like ms-3 */
      font-size: 16px;
    }

    #run-game {
      font-weight: 600;
      padding: 6px 14px;
      font-size: 1rem;
      border-radius: 6px;
      min-height: 34px;
      min-width: 127px;
      transition: background-color 0.2s, opacity 0.2s;
      margin: 0px;
      font-size: 22px;
      background-color: rgb(70, 70, 190);
    }

    #run-game:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .controls-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem; /* spacing between toggle and button */
      padding: 0.5rem;
    }

    .xterm-scroll-area {
      position: relative; /* or fixed if needed */
      z-index: 9999 !important;  /* very high to be on top */
    }
    .xterm-viewport {
      z-index: 1; /* or a lower value */
      position: relative;
      background: transparent !important;
    }
    .terminal {
      border-radius: 10px;
      border: 6px solid green;       /* Full border (you can remove this if you only want bottom) */
      background-color: black;
    }
    :fullscreen {
      width: 100vw;
      height: 100vh;
    }

    :-webkit-full-screen {
      width: 100vw;
      height: 100vh;
    }
    :-moz-full-screen {
      width: 100vw;
      height: 100vh;
    }
    :-ms-fullscreen {
      width: 100vw;
      height: 100vh;
    }

    #terminal-container {
      overflow: visible;
      width: 100%;
      height: 100%;
    }

    .btn-outline-primary{
      font-size: 25px;
      /* margin: 0px; */
    }

    .xterm-viewport {
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.3) transparent;
    }

    .xterm-viewport::-webkit-scrollbar {
      width: 10px;
    }
    .xterm-viewport::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.4);
      border-radius: 5px;
    }

  </style>
  <link rel="stylesheet" href="/styles/style.css">
</head>

<body>
  
  
  <!--- lower information --->
  <!-- divider -->
  <div class="text-center my-4">
    <hr class="mx-auto" id = "middle-divider" style="width: 40%; height: 1px">
  </div>
  <div class="m-4">
    <ul class="nav nav-pills d-flex flex-row gap-2 d-flex justify-content-center my-3" id="myTab" role="tablist">
      <li class="nav-item" role="presentation">
        <!-- <button class="nav-link active" data-bs-toggle="tab"
                data-bs-target="#about" type="button" role="tab"
                aria-controls="about" aria-selected="true">
          About
        </button> -->
      </li>
    </ul>
    <br>
    <div class="tab-content mx-auto" id = "tab-content-info" style="width: 40%;" >
      <!--  each pane names the file it should pull -->
      <div class="tab-pane fade show active" id="about"
          data-src="./text/about.html"
          ></div>

          </div>
    </div>
  </div>


  <!-- Application entry point -->
  <script src = "TextSetup.js" defer></script>
  <script src = "UnitySetup.js"></script>
</body>
</html>
